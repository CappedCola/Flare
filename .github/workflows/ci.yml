name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Jest (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # The suite is deliberately hermetic: jest's moduleNameMapper swaps every
      # @react-native-firebase package for a local mock before firebase.ts is
      # evaluated, so no test opens a network connection or initialises a native
      # bridge. tests/harness/firebase-boundary.test.ts asserts that boundary
      # holds, which is what keeps the rest of the suite reproducible.
      - name: Run tests
        run: npm run test:ci

      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true
